[package]
name = "hydroxus-ai"
version = "0.1.0"
edition = "2021"
# nalgebra 0.35 needs 1.89; checked with `cargo +1.89 test --all-features`.
rust-version = "1.89"
license = "MIT"
description = "AI for Hydroxus games: perception (sight only in front, hearing along the corridors), tactics (searching, chasing, cover, fighting as a team) and navigation (a walk grid, routes, trains and driving), with Metal Gear's alert phases."
repository = "https://github.com/d4140n-4h3-1/hydroxus-ai"
keywords = ["game", "ai", "stealth", "hydroxus", "gamedev"]
categories = ["game-development"]

# Independent of the engine: only the vector maths, the same nalgebra the engine re-exports, so
# its `Vector3<f32>` is the engine's. The game casts the rays, moves the nodes and plays the
# animations; this decides what an NPC sees, hears and does about it.
[dependencies]
nalgebra = "0.35"
# Reading a game's tuning from a file (see `Tuning`).
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde", "nalgebra/serde-serialize"]
