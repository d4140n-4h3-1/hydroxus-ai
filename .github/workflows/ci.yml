name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.89.0', stable]
        features: ['', '--all-features']
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal
      - name: Run tests
        run: cargo +${{ matrix.rust }} test --locked ${{ matrix.features }}
